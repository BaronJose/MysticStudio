<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mystic Studio Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* 🎨 CSS variables for easy theming */
        :root {
            /* User-provided palette */
            --muted-sage: #8A9A5B;
            /* main menu bar background, accents */
            --soft-pink: #2e7d32;
            /* hover / accents */
            --cream: #FDF8F0;
            /* main text / links on sage background */
            --text-color: #333;
            /* body text (kept dark for readability) */
            --text-light: #666;
            --success-green: #2e7d32;
            --white: #fff;
            --bg-light: #F7E4E4;
            /* page background (left white for contrast) */
        }

        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-light);
            color: var(--text-color);
        }

        .book-btn:hover,
        .book-btn:focus,
        .book-btn:active {
            background: var(--soft-pink);
            color: var(--muted-sage);
            transform: translateY(1px);
            outline: none;
        }

        .nav-link.active {
            color: var(--soft-pink);
            background: transparent;
            border-color: var(--soft-pink);
            /* soft-pink border for active */
        }

        .price-list {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px;
            background: transparent;
        }

        h1 {
            text-align: center;
            font-size: 1.6em;
            margin-bottom: 12px;
            color: var(--muted-sage);
        }

        /* ✅ Styles for loading and error messages */
        .status-message {
            text-align: center;
            margin-top: 40px;
            font-weight: 600;
            color: var(--text-light);
        }

        .category-header {
            font-size: 1.2em;
            font-weight: bold;
            margin: 24px 0 12px;
            color: var(--muted-sage);
            border-bottom: 2px solid var(--soft-pink);
            /* soft-pink accent */
            padding-bottom: 4px;
        }

        .service-card {
            background: var(--white);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1em;
            font-weight: 600;
            color: var(--success-green);
        }

        .service-tags {
            font-size: 0.85em;
            color: #555;
        }

        .service-description {
            font-size: 0.9em;
            color: var(--text-light);
            margin-top: 6px;
        }

        /* Call-to-action booking block (replaces footer element) */
        .book-now {
            text-align: center;
            margin: 18px 0;
            padding: 0 16px;
        }

        .book-now h2 {
            margin: 0 0 8px;
            font-size: 1.1em;
            color: var(--muted-sage);
        }

        .book-btn {
            display: inline-block;
            background: var(--muted-sage);
            color: var(--cream);
            padding: 8px 14px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            transition: transform 0.08s ease, background 0.12s ease, color 0.12s ease;
        }

        .book-btn:hover,
        .book-btn:focus,
        .book-btn:active {
            background: var(--soft-pink);
            color: var(--muted-sage);
            transform: translateY(1px);
            outline: none;
        }
    </style>
</head>

<body>
    <main class="price-list">
        <h1>Mystic Lash Artist Studio</h1>
        <div class="book-now" aria-label="Book now">
            <a class="book-btn" href="https://app.squareup.com/appointments/book/llldwdhcgo4ojd/LSN1YJS8A43DE/start"
                target="_blank" rel="noopener noreferrer" aria-label="Book appointment">Book Now</a>
        </div>
        <div id="services-container">
            <p class="status-message">🧘‍♀️ Loading relaxing services...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script>
        const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRsjGP9cG4Z_evQ0RBuAeyUwtBH19JpxzIs4-QVHkOrjqxx7yIMj3iab4TlAX8YqRy-7jH-IfgA2Iah/pub?output=csv';
        const servicesContainer = document.getElementById('services-container');

        /**
         * ✅ Securely creates a service card element without using innerHTML.
         * @param {object} service - An object with service details.
         * @returns {HTMLElement} The card element.
         */
        function createServiceCard(service) {
            const card = document.createElement('div');
            card.className = 'service-card';

            const header = document.createElement('div');
            header.className = 'service-header';

            const serviceName = document.createElement('span');
            serviceName.textContent = service.Service;

            const serviceTags = document.createElement('span');
            serviceTags.className = 'service-tags';
            serviceTags.textContent = `$${service.Price} · ${service.Duration}`;

            header.appendChild(serviceName);
            header.appendChild(serviceTags);

            const description = document.createElement('div');
            description.className = 'service-description';
            description.textContent = service.Description;

            card.appendChild(header);
            card.appendChild(description);
            return card;
        }

        /**
         * ✅ Renders services grouped by category into the container.
         * @param {Array<object>} data - The array of service data.
         */
        function renderServices(data) {
            servicesContainer.innerHTML = ''; // Clear loading message

            const grouped = data.reduce((acc, service) => {
                const category = service.Category || 'Other';
                if (!acc[category]) acc[category] = [];
                acc[category].push(service);
                return acc;
            }, {});

            for (const category in grouped) {
                const categoryHeader = document.createElement('div');
                categoryHeader.className = 'category-header';
                categoryHeader.textContent = category;
                servicesContainer.appendChild(categoryHeader);

                grouped[category].forEach(service => {
                    const card = createServiceCard(service);
                    servicesContainer.appendChild(card);
                });
            }
        }

        Papa.parse(sheetURL, {
            download: true,
            header: true,
            complete: (results) => {
                // ✅ Filter out empty rows from the spreadsheet
                const validData = results.data.filter(s => s.Service && s.Price);
                renderServices(validData);
            },
            // ✅ Add error handling for network or parsing failures
            error: (err) => {
                console.error("Data loading error:", err);
                servicesContainer.innerHTML = `<p class="status-message">❌ Oops! We couldn't load the services right now. Please try again later.</p>`;
            }
        });
    </script>
</body>

</html>
