<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mystic Studio Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* 🎨 CSS variables for easy theming */
        :root {
            /* User-provided palette */
            --muted-sage: #8A9A5B;
            /* main menu bar background, accents */
            --soft-pink: #2e7d32;
            /* hover / accents */
            --cream: #FDF8F0;
            /* main text / links on sage background */
            --text-color: #333;
            /* body text (kept dark for readability) */
            --text-light: #666;
            --success-green: #2e7d32;
            --white: #fff;
            --bg-light: #F7E4E4;
            /* page background (left white for contrast) */
        }

        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-light);
            color: var(--text-color);
        }

        .book-btn:hover,
        .book-btn:focus,
        .book-btn:active {
            background: var(--soft-pink);
            color: var(--muted-sage);
            transform: translateY(1px);
            outline: none;
        }

        .book-instruction {
            text-align: center;
            margin: 6px 0 0;
            color: #555;
            font-size: 0.98em;
        }

        .contact-card {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            max-width: 520px;
            margin: 8px auto 18px;
            padding: 12px;
            background: var(--white);
            border-radius: 12px;
            border: 1px solid rgba(138, 154, 91, 0.08);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            align-items: center;
        }

        .contact-left {
            flex: 1 1 60%;
            min-width: 180px;
        }

        .contact-right {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .contact-phone {
            display: inline-block;
            font-weight: 700;
            color: var(--muted-sage);
            text-decoration: none;
            margin-bottom: 6px;
        }

        .contact-phone:focus-visible {
            outline: 3px solid rgba(138, 154, 91, 0.15);
            outline-offset: 3px;
        }

        .contact-address {
            font-style: normal;
            color: #666;
            font-size: 0.95em;
            margin: 0;
        }

        .social-links a {
            display: inline-block;
            padding: 6px 8px;
            border-radius: 8px;
            background: transparent;
            color: var(--muted-sage);
            text-decoration: none;
            font-weight: 700;
            border: 1px solid transparent;
        }

        .social-links a:hover {
            background: var(--soft-pink);
            color: var(--muted-sage);
            border-color: var(--soft-pink);
        }

        @media (max-width:420px) {
            .contact-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .contact-right {
                width: 100%;
                justify-content: flex-start;
            }
        }

        .nav-link.active {
            color: var(--soft-pink);
            background: transparent;
            border-color: var(--soft-pink);
            /* soft-pink border for active */
        }

        .price-list {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px;
            background: transparent;
        }

        h1 {
            text-align: center;
            font-size: 1.6em;
            margin-bottom: 12px;
            color: var(--muted-sage);
        }

        /* ✅ Styles for loading and error messages */
        .status-message {
            text-align: center;
            margin-top: 40px;
            font-weight: 600;
            color: var(--text-light);
        }

        .category-header {
            font-size: 1.2em;
            font-weight: bold;
            margin: 24px 0 12px;
            color: var(--muted-sage);
            border-bottom: 2px solid var(--soft-pink);
            /* soft-pink accent */
            padding-bottom: 4px;
        }

        .service-card {
            background: var(--white);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            display: block;
            /* allow anchor usage */
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        /* accessible focus state for clickable cards */
        .service-card:focus-visible {
            outline: 3px solid rgba(138, 154, 91, 0.15);
            outline-offset: 4px;
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1em;
            font-weight: 600;
            color: var(--success-green);
        }

        .service-tags {
            font-size: 0.85em;
            color: #555;
        }

        .service-description {
            font-size: 0.9em;
            color: var(--text-light);
            margin-top: 6px;
        }

        /* Call-to-action booking block (replaces footer element) */
        .book-now {
            text-align: center;
            margin: 18px 0;
            padding: 0 16px;
        }

        .book-now h2 {
            margin: 0 0 8px;
            font-size: 1.1em;
            color: var(--muted-sage);
        }

        .book-btn {
            display: inline-block;
            background: var(--muted-sage);
            color: var(--cream);
            padding: 8px 14px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            transition: transform 0.08s ease, background 0.12s ease, color 0.12s ease;
        }

        .book-btn:hover,
        .book-btn:focus,
        .book-btn:active {
            background: var(--soft-pink);
            color: var(--muted-sage);
            transform: translateY(1px);
            outline: none;
        }

        /*
 * Styles for the Balanced & Symmetrical Contact Card
 */

        /* Main container for the card */
        .contact-info-balanced {
            display: flex;
            flex-wrap: wrap;
            /* CHANGED: Allows items to wrap to the next line */
            gap: 25px 15px;
            /* CHANGED: Adds vertical and horizontal spacing between items */

            background-color: #ffffff;
            border-radius: 12px;
            padding: 25px;
            /* Adjusted padding */
            border: 1px solid #f0e4e7;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            max-width: 600px;
            margin: 20px auto;
        }

        /* Styles for each of the four columns */
        .contact-column {
            flex: 1 1 45%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }

        /* Shared style for the top icons (phone, map) */
        .contact-icon {
            font-size: 24px;
            /* Icon size */
            color: #555;
            margin-bottom: 12px;
        }

        /* Main text like the phone number and address */
        .contact-main-text {
            font-weight: 600;
            color: #333;
            text-decoration: none;
            font-size: 1em;
            /* Adjust as needed */
            line-height: 1.3;
        }

        .contact-main-text:hover {
            color: #d4a5b1;
            /* A hover color from your theme */
        }

        /* Helper text like "Call or Text" */
        .contact-helper-text {
            font-size: 0.85em;
            color: #888;
            margin: 4px 0 0 0;
        }

        /* Container for the social media icons in the third column */
        .social-icons-container {
            display: flex;
            gap: 25px;
            /* Space between the social icons */
        }

        /* Styles for the social media icons */
        .social-icon {
            font-size: 26px;
            /* Size of IG/FB icons */
            color: #333;
            transition: color 0.2s ease-in-out;
        }

        .social-icon:hover {
            color: #d4a5b1;
            /* Hover color */
        }

        /* This styles the link that wraps the icon and text */
        .contact-social-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            /* This ensures it takes up the full space like the other columns */
            flex-grow: 1;
            justify-content: center;
        }

        /* This updates the Instagram icon to be larger, matching our design */
        /* It also correctly targets the icon inside the link */
        .contact-social-link .fab.fa-instagram {
            font-size: 36px;
            /* Increased from 26px */
            margin-bottom: 8px;
            /* Adds space between icon and text */
            color: #333;
            transition: color 0.2s ease-in-out;
        }

        /* This styles the helper text inside the link */
        .contact-social-link .contact-helper-text {
            font-weight: 500;
            transition: color 0.2s ease-in-out;
        }

        /* This creates the hover effect for the whole Instagram block */
        .contact-social-link:hover .fa-instagram,
        .contact-social-link:hover .contact-helper-text {
            color: #d4a5b1;
        }
    </style>
</head>

<body>
    <main class="price-list">
        <h1>Mystic Lash Artist Studio</h1>
        <div class="book-now" aria-label="Book now">
            <h2>Book now</h2>
            <p class="book-instruction">Select a service below to book online.</p>
        </div>

        <!-- Contact card: placed under the booking instruction for easy access -->
        <section class="contact-info-balanced" aria-label="Contact information">
            <div class="contact-column">
                <i class="fas fa-building contact-icon" aria-hidden="true"></i>
                <p class="contact-main-text">Business Hours</p>
                <p class="contact-helper-text">Tues - Sun, 9am - 5pm</p>
            </div>
            <div class="contact-column">
                <i class="fas fa-phone-alt contact-icon" aria-hidden="true"></i>
                <a class="contact-main-text" href="tel:+15597095580">(559) 709-5580</a>
                <p class="contact-helper-text">Call or Text</p>
            </div>

            <div class="contact-column">
                <i class="fas fa-map-marker-alt contact-icon" aria-hidden="true"></i>
                <a class="contact-main-text"
                    href="https://www.google.com/maps/search/?api=1&query=3642+E+McKinley+Ave,+Fresno,+CA+93703"
                    target="_blank" rel="noopener noreferrer">
                    3642 East McKinley Ave
                </a>
                <p class="contact-helper-text">Fresno, CA</p>
            </div>

            <div class="contact-column">
                <div class="contact-column">
                    <i class="fab fa-instagram contact-icon" aria-hidden="true"></i>
                    <a class="contact-main-text" href="https://www.instagram.com/mysticlashartiststudio" target="_blank"
                        rel="noopener noreferrer">
                        Follow Us
                    </a>
                    <p class="contact-helper-text">on Instagram</p>
                </div>
        </section>

        <div id="services-container">
            <p class="status-message">🧘‍♀️ Loading relaxing services...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script>
        const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRsjGP9cG4Z_evQ0RBuAeyUwtBH19JpxzIs4-QVHkOrjqxx7yIMj3iab4TlAX8YqRy-7jH-IfgA2Iah/pub?output=csv';
        // Booking link used when a user clicks a service card (opens in new tab)
        const bookingURL = 'https://app.squareup.com/appointments/book/llldwdhcgo4ojd/LSN1YJS8A43DE/start';
        // Acceptable CSV columns that may contain a per-service booking link.
        const bookingColumns = ['BookingLink', 'BookingURL', 'Link', 'URL'];
        const servicesContainer = document.getElementById('services-container');

        /**
         * ✅ Securely creates a service card element without using innerHTML.
         * @param {object} service - An object with service details.
         * @returns {HTMLElement} The card element.
         */
        function createServiceCard(service) {
            // Create anchor wrapper so the whole card is clickable
            const link = document.createElement('a');
            link.className = 'service-card';

            // Try to read a per-service booking link from the CSV using several possible column names.
            let serviceLink = null;
            for (const col of bookingColumns) {
                if (service[col] && service[col].trim()) {
                    serviceLink = service[col].trim();
                    break;
                }
            }

            // Fallback to the global booking URL when no per-service link is present
            if (!serviceLink) serviceLink = bookingURL;

            // Normalize: if the link looks like a web URL but lacks scheme, add https://
            if (/^[^:\/?#]+\.[^\s]+$/.test(serviceLink)) {
                serviceLink = 'https://' + serviceLink;
            }

            link.href = serviceLink;

            // Open external HTTP(s) links in a new tab; otherwise keep default behavior
            try {
                const urlProto = new URL(serviceLink).protocol;
                if (urlProto === 'http:' || urlProto === 'https:') {
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                }
            } catch (e) {
                // if URL parsing fails, still set target to _blank as a safe default
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
            }

            link.setAttribute('aria-label', `Book ${service.Service}`);

            const header = document.createElement('div');
            header.className = 'service-header';

            const serviceName = document.createElement('span');
            serviceName.textContent = service.Service;

            const serviceTags = document.createElement('span');
            serviceTags.className = 'service-tags';
            serviceTags.textContent = `$${service.Price} · ${service.Duration}`;

            header.appendChild(serviceName);
            header.appendChild(serviceTags);

            const description = document.createElement('div');
            description.className = 'service-description';
            description.textContent = service.Description;

            link.appendChild(header);
            link.appendChild(description);
            return link;
        }

        /**
         * ✅ Renders services grouped by category into the container.
         * @param {Array<object>} data - The array of service data.
         */
        function renderServices(data) {
            servicesContainer.innerHTML = ''; // Clear loading message

            const grouped = data.reduce((acc, service) => {
                const category = service.Category || 'Other';
                if (!acc[category]) acc[category] = [];
                acc[category].push(service);
                return acc;
            }, {});

            for (const category in grouped) {
                const categoryHeader = document.createElement('div');
                categoryHeader.className = 'category-header';
                categoryHeader.textContent = category;
                servicesContainer.appendChild(categoryHeader);

                grouped[category].forEach(service => {
                    const card = createServiceCard(service);
                    servicesContainer.appendChild(card);
                });
            }
        }

        Papa.parse(sheetURL, {
            download: true,
            header: true,
            complete: (results) => {
                // ✅ Filter out empty rows from the spreadsheet
                const validData = results.data.filter(s => s.Service && s.Price);
                renderServices(validData);
            },
            // ✅ Add error handling for network or parsing failures
            error: (err) => {
                console.error("Data loading error:", err);
                servicesContainer.innerHTML = `<p class="status-message">❌ Oops! We couldn't load the services right now. Please try again later.</p>`;
            }
        });
    </script>
</body>

</html>
